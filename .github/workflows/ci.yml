# Three independent jobs so each keeps its own red/green mark. What each gate
# actually checks lives in stylua.toml / .luacheckrc / scripts/test.sh -- this
# workflow only wires those up, it does not re-specify them. Run the same
# three locally with `stylua --check .`, `luacheck .` and `scripts/test.sh`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # PUC Lua 5.4, not LuaJIT: `std = "luajit"` in .luacheckrc pins which
      # globals/stdlib luacheck checks *against* -- independent of which
      # interpreter runs the luacheck binary itself.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck .

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # lib.nvim is a hard runtime dependency (lazy, memo, notify, bindings.*,
      # debounce, fs.*) -- a headless run has no plugin manager, so it is
      # checked out the way scripts/minimal_init.lua's `.deps/` candidate
      # expects.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      # plenary.nvim: the busted-compatible harness the specs are written
      # against.
      - uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: .deps/plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          scripts/test.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # Publishes the commit that just passed every gate above as the
  # `ci-verified` branch. Consumer repos pin their dependency checkout to it
  # (ref: ci-verified) so a broken push here cannot turn their CI red.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [stylua, luacheck, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards: two pushes can finish out of order,
      # and the older run must not overwrite the newer verified commit. The
      # lookup fails closed (an API or network error stops the job instead of
      # falling through to a push) and the update carries a lease on the tip it
      # compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Look the branch up on the remote instead of inferring "missing" from an API
          # error: a failed lookup must stop the job, not fall through to a push.
          tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
          if [ -z "$tip" ]; then
            # First publish. A plain push creates the branch and is rejected if a
            # concurrent run created it first.
            git push origin HEAD:refs/heads/ci-verified
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
          case "$status" in
            behind | identical)
              echo "ci-verified ($tip) is '$status' relative to $SHA (published or superseded); leaving it alone"
              ;;
            ahead | diverged)
              # The lease makes the server refuse the update if ci-verified moved since
              # the comparison, so an older run can never overwrite a newer one.
              git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip"
              ;;
            *)
              echo "::error::unexpected compare status '$status' for $tip...$SHA"
              exit 1
              ;;
          esac
